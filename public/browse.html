<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>文件浏览 · minilist</title>
<link rel="icon" href="/__ml/favicon.svg">
<link rel="stylesheet" href="/__ml/base.css">
<link rel="stylesheet" href="/files/browse.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="logo" src="/__ml/logo.svg" alt="minilist">
    <span id="pageTitle">文件浏览</span>
    <span class="ver" id="rootHint"></span>
  </div>
  <div class="topbar-right">
    <span class="who" id="who">未登录 · 只读</span>
    <a class="btn ghost" href="/admin/" id="btnConsole">控制台</a>
    <button class="btn ghost" id="btnTheme" type="button">浅色</button>
    <button class="btn primary" id="btnLogin" type="button">登录</button>
    <button class="btn ghost" id="btnLogout" type="button" hidden>退出</button>
  </div>
</header>

<main class="wrap browse-wrap">

  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn icon" id="btnUp" type="button" title="上一级">↑</button>
      <button class="btn icon" id="btnRefresh" type="button" title="刷新">⟳</button>
      <nav class="crumbs" id="crumbs"></nav>
    </div>
    <div class="toolbar-right">
      <input type="text" id="search" class="searchbox" placeholder="在当前文件夹过滤…">
      <select id="sort" class="sortsel">
        <option value="name">名称</option>
        <option value="time">时间</option>
        <option value="size">大小</option>
        <option value="type">类型</option>
      </select>
      <button class="btn icon" id="btnSortDir" type="button" title="切换升序/降序">↑</button>
      <button class="btn" id="btnNewFolder" type="button">新建文件夹</button>
      <button class="btn" id="btnNewFile" type="button">新建文件</button>
      <button class="btn primary" id="btnUpload" type="button">上传</button>
    </div>
  </div>

  <div class="bulkbar" id="bulkbar" hidden>
    <span><b id="selCount">0</b> 项已选择</span>
    <div class="bulk-actions">
      <button class="btn sm" id="btnZip" type="button">打包下载</button>
      <button class="btn sm danger" id="btnBulkDelete" type="button">删除</button>
      <button class="btn sm ghost" id="btnClearSel" type="button">取消选择</button>
    </div>
  </div>

  <div class="filepanel" id="panel">
    <div class="thead">
      <div class="c-chk"><input type="checkbox" id="chkAll" title="全选"></div>
      <div class="c-name">名称</div>
      <div class="c-size">大小</div>
      <div class="c-time">修改时间</div>
      <div class="c-ops">操作</div>
    </div>

    <div id="rows"></div>

    <div class="loading" id="loading" hidden><span class="spinner"></span> 正在读取…</div>

    <div class="empty" id="empty" hidden>
      <div class="empty-icon" aria-hidden="true">▤</div>
      <h3 id="emptyTitle">这个文件夹是空的</h3>
      <p class="muted small" id="emptyDesc">上传文件，或者新建文件夹试试</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn primary write-only" id="btnEmptyUpload" type="button">上传文件</button>
        <button class="btn write-only" id="btnEmptyFolder" type="button">新建文件夹</button>
      </div>
    </div>

    <div class="dropveil" id="dropveil">
      <div>
        <strong>松开即可上传到当前文件夹</strong>
        <span class="small">支持一次拖入多个文件</span>
      </div>
    </div>
  </div>

  <div class="browse-foot">
    <span id="status" class="muted small"></span>
    <span id="roHint" class="muted small" hidden>只读模式：登录后才能上传 / 修改 / 删除</span>
  </div>

</main>

<input type="file" id="fileInput" multiple hidden>
<div id="toasts" class="toasts"></div>

<script src="/__ml/ui.js"></script>
<script src="/files/browse.js"></script>
</body>
</html>
